# Confirms each push to main reached the live site and the app opens without errors.
# Threads read this run's result (GitHub Actions) instead of asking someone to open the site.
name: Live site check

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'plans/**', 'supabase/**', '.claude/**']
  workflow_dispatch:

concurrency:
  group: live-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/live
      # Uses the runner's preinstalled Chrome to save minutes; downloads Chromium only if missing.
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null; then echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
          else npx playwright install --with-deps chromium; fi
      - name: Wait for deploy and open the site
        env:
          EXPECTED: ${{ github.sha }}
        run: node scripts/live/check.mjs
